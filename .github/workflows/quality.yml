name: quality

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Repository integrity
        run: |
          set -euo pipefail
          # Match credential VALUES by shape, never variable names.
          #
          # The previous check grepped for the strings GEMINI_API_KEY,
          # CLICKUP_TOKEN, TELEGRAM_BOT_TOKEN and 'sk-'. Those are the names of
          # environment variables, so every line that correctly reads a secret
          # from the environment failed the scan -- including
          # `const TOKEN = env.CLICKUP_TOKEN;`, a regex that DETECTS leaked
          # keys, and a test asserting `"CLICKUP_TOKEN" not in combined`. It
          # could not pass while the code did the right thing, and it never had
          # (audit F-21: CI has never passed on any commit). It also taught
          # nobody anything, because the only way to satisfy it was to stop
          # naming the variables.
          #
          # These patterns match the issued-token shapes instead. Verified
          # against synthetic keys for each provider: all flagged; and against
          # env-var names, env reads, absence assertions and the detector regex
          # in agents/coding/main.py: none flagged.
          #
          # git grep scans tracked files only, so an untracked node_modules
          # cannot influence the result, and documentation/ is deliberately NOT
          # excluded any more -- audit S-3 noted it is the directory most likely
          # to receive a pasted token.
          PATTERNS='gsk_[A-Za-z0-9]{40,}|sk-or-v1-[A-Za-z0-9]{40,}|sk-[A-Za-z0-9]{32,}|AIza[A-Za-z0-9_-]{30,}|tvly-[A-Za-z0-9]{24,}|pk_[0-9]{6,}_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|gho_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{50,}|xox[baprs]-[A-Za-z0-9-]{20,}|[0-9]{8,10}:[A-Za-z0-9_-]{35}'
          if git grep -InE "$PATTERNS" -- .; then
            echo '::error::Credential-shaped value detected in tracked files'
            exit 1
          fi
          # Ensure sensitive files are not tracked
          if git ls-files | grep -E '^\.env$|^\.env\.|^config/juma\.secrets\.json$|\.pem$|\.key$|providers\.key$'; then
            echo '::error::Sensitive file is tracked'
            exit 1
          fi

      - name: Syntax checks
        run: |
          set -euo pipefail
          python -m py_compile agents/research/main.py
          python -m py_compile agents/coding/main.py
          python -m py_compile orchestrator/orchestrator.py
          python -m py_compile orchestrator/approval.py
          python -m py_compile orchestrator/flagship.py
          python -m py_compile tests/test_step6_approval.py
          python -m py_compile tests/test_step7_flagship_unit.py
          python -m py_compile tests/test_step7_flagship_e2e.py
          python -m py_compile tests/test_step7_flagship_failures.py
          node --check agents/projects/main.js
          node --check automation/clickup.js
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command "\$errors = \$null; \$null = [System.Management.Automation.Language.Parser]::ParseFile('automation/generate-proposal.ps1', [ref]\$null, [ref]\$errors); if (\$errors) { foreach (\$e in \$errors) { Write-Error \$e }; exit 1 } else { Write-Host 'OK' }"
          else
            echo 'pwsh not available; skipping PowerShell syntax check on this runner'
          fi

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          # The repository had none until proposals gained PDF rendering.
          # Only orchestrator/proposal_pdf.py needs these, and it imports them
          # lazily, so everything else still runs without them -- but the PDF
          # suite does not, so CI installs them.
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Approval boundary tests
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_step6_approval.py

      - name: Flagship unit tests
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_step7_flagship_unit.py

      - name: Flagship end-to-end tests
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_step7_flagship_e2e.py

      - name: Flagship failure-injection tests
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_step7_flagship_failures.py

      - name: Integration tests (safe subset)
        env:
          # Prevent accidental external sends by default
          APPROVAL_MODE: 'true'
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_step7_flagship_integration.py

      - name: Agent and document tests
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_p0_1_workspace_confinement.py
          PYTHONPATH=. python tests/test_research_agent.py
          PYTHONPATH=. python tests/test_coding_agent.py
          PYTHONPATH=. python tests/test_proposal_pdf.py
          node tests/test_projects_agent.js

      - name: Documentation consistency check
        run: |
          set -euo pipefail
          if [ -f README.md ]; then
            # The old check looked for 'stepfun/step-3.7-flash:free', a model
            # this project has not used for a long time -- it asserted a fact
            # that had stopped being true and warned about its own staleness.
            # Check for the things the README must not lose instead.
            for needle in 'GROQ_API_KEY' 'apr_enquiry' 'approval'; do
              if ! grep -qi "$needle" README.md; then
                echo "::warning::README no longer documents $needle"
              fi
            done
          fi
